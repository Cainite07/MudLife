name: Build MudLife APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      build_release:
        description: Build with the existing permanent release key
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Keystore for Release
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing permanent release keystore secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mudlife-release-2026.p12"
          echo "MUDLIFE_KEYSTORE_FILE=$RUNNER_TEMP/mudlife-release-2026.p12" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        env:
          MUDLIFE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MUDLIFE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MUDLIFE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_release
        uses: actions/upload-artifact@v4
        with:
          name: mudlife-release
          path: app/build/outputs/apk/release/*.apk
